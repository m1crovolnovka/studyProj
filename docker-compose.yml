services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: watchlist
      POSTGRES_USER: watchlist
      POSTGRES_PASSWORD: watchlist
    ports:
      - "5432:5432"
    volumes:
      - watchlist-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watchlist -d watchlist"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    profiles: ["app"]
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/watchlist
      SPRING_DATASOURCE_USERNAME: watchlist
      SPRING_DATASOURCE_PASSWORD: watchlist
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      SPRING_SECURITY_USER_NAME: admin
      SPRING_SECURITY_USER_PASSWORD: admin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  watchlist-pg:
