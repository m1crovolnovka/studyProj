spring:
  application:
    name: watchlist

  datasource:
    url: jdbc:postgresql://localhost:5432/watchlist
    username: watchlist
    password: watchlist

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  docker:
    compose:
      file: docker-compose.yml

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

  api-docs:
    path: /v3/api-docs

jwt:
  issuer: ${JWT_ISSUER:watchlist-api}
  audience: ${JWT_AUDIENCE:watchlist-api}

  private-key: ${JWT_PRIVATE_KEY_PATH:classpath:keys/private.pem}
  public-key: ${JWT_PUBLIC_KEY_PATH:classpath:keys/public.pem}

  access-token-lifetime: ${JWT_ACCESS_TOKEN_LIFETIME:15m}
  refresh-token-lifetime: ${JWT_REFRESH_TOKEN_LIFETIME:30d}

  secure-cookie: ${JWT_SECURE_COOKIE:false}